# ── ClimateInsight Project Configuration ────────────────────────────────────
# This file is the canonical metadata source for the project.
# App metadata is served to frontend consumers through /api/config.

[app]
name        = "ClimateInsight"
full_name   = "ClimateInsight Chatbot"
version     = "0.1.0"
description = "A retrieval-augmented chatbot grounded in the IPCC AR6 Synthesis Report, built to make climate science accessible to everyone."
license     = "MIT"

[authors]
  [[authors.person]]
  name  = "Peter Murray-Rust"

  [[authors.person]]
  name  = "Aleena Harold Peter"

[project]
organization  = "semanticClimate"
source_corpus = "IPCC AR6 Synthesis Report (2023)"
language      = "en"
status        = "development"          # development | beta | stable
release_date  = "2026-07-08"

[backend]
framework     = "FastAPI"
llm_provider  = "Ollama (local, open source)"
llm_model     = "llama3.2:latest"
vector_store  = "ChromaDB"
embedding     = "sentence-transformers (all-MiniLM-L6-v2)"
mind_map      = "Mermaid.js"

[frontend]
framework     = "Vanilla HTML/CSS/JS"
fonts         = ["Jost"]

# Terms and scientific evidence come only from these documents.
# Wikipedia enrichment remains enabled for supplementary descriptions and identities.
[encyclopedia]
mode = "generated"
# The compatible Encyclopedia helpers are bundled in this repository.
repository = "."
source = "data/raw/ipcc_reference.html"
glossary = "data/raw/IPCC_AR6_SYR_Glossary.html"
papers = [
  "data/raw/ocean_heatwaves_2026/PMC10011364.xml",
  "data/raw/ocean_heatwaves_2026/PMC10468509.xml",
  "data/raw/ocean_heatwaves_2026/PMC10808424.xml",
  "data/raw/ocean_heatwaves_2026/PMC11128013.xml",
  "data/raw/ocean_heatwaves_2026/PMC11427463.xml",
  "data/raw/ocean_heatwaves_2026/PMC11580339.xml",
  "data/raw/ocean_heatwaves_2026/PMC11733174.xml",
  "data/raw/ocean_heatwaves_2026/PMC12980662.xml",
  "data/raw/ocean_heatwaves_2026/PMC7653907.xml",
  "data/raw/ocean_heatwaves_2026/PMC8294506.xml",
  "data/raw/ocean_heatwaves_2026/PMC9135278.xml",
  "data/raw/ocean_heatwaves_2026/PMC9613989.xml",
]
top_n = 500
max_terms = 300
min_count = 2
glossary_min_count = 1
